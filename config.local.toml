# Local development config — PhotoPrism on LAN
# NOT committed to git (add config.local.toml to .gitignore)

[display]
slide_duration_secs = 10
transition          = "fade"
transition_ms       = 800
fill_screen         = false
letterbox_blur      = true
ken_burns           = false
show_osd            = true
show_clock          = false
order               = "newest_first"
on_this_day_boost   = true
max_image_mb        = 100
max_megapixels      = 64

[cache]
max_mb = 512

[http]
host = "0.0.0.0"
port = 8188

[[sources]]
name     = "photoprism"
enabled  = true
url      = "http://192.168.68.71:2342"
username = "admin"
password = "Password"
per_page = 100
order    = "newest"
include_private  = false
include_archived = false
skip_tls_verify  = false
