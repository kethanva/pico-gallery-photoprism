# PicoGallery Cog / WPE WebKit settings for Pi Zero 2 W (512 MB RAM).
# Installed to /etc/picogallery/cog.conf by install.sh and loaded via cog -C.
# Property names match WebKitSettings (see: cog --help-websettings).

[websettings]
# The frame is a single-page slideshow — no back-navigation history to retain.
enable-page-cache=false
# No service-worker / offline app shell on the read-only appliance.
enable-offline-web-application-cache=false
# Slideshow uses still JPEG/WebP thumbnails only — skip stream decode buffers.
enable-media-stream=false
enable-mediasource=false
