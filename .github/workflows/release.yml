name: CI & Release

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          
      - name: Install root dependencies
        run: npm ci --ignore-scripts --no-audit

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit

      - name: Install Chromium for browser smoke test
        working-directory: frontend
        run: npx --no-install playwright install --with-deps chromium
        
      - name: Run CI Checks
        run: |
          npm run audit:security
          npm run lint
          npm test
          bash -n install.sh uninstall.sh run.sh kiosk/cog/*.sh scripts/*.sh
          npm --prefix frontend run lint
          npm --prefix frontend run security:scan
          npm --prefix frontend test
          npm --prefix frontend run test:host-smoke

      - name: Build the production frontend from source
        run: npm --prefix frontend run build

      - name: Verify committed release assets are reproducible
        run: git diff --exit-code -- frontend/dist

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit

      - name: Rebuild release frontend
        run: npm --prefix frontend run build
          
      - name: Determine version
        id: version
        run: node scripts/get-next-version.js
        
      - name: Create Release Archive
        if: steps.version.outputs.skip != 'true'
        run: |
          # Inject release version details into install.sh
          sed -i 's/SCRIPT_VERSION="2.0.0"/SCRIPT_VERSION="'"${{ steps.version.outputs.version }}"'"/g' install.sh

          mkdir -p picogallery-release
          
          # Ship only runtime frontend artifacts required by photoprism-host.
          mkdir -p picogallery-release/frontend
          cp frontend/index.html picogallery-release/frontend/
          cp -r frontend/static picogallery-release/frontend/
          cp -r frontend/dist picogallery-release/frontend/
          cp -r kiosk picogallery-release/
          
          cp package.json picogallery-release/
          cp -r scripts picogallery-release/
          # Kiosk profile data + shared resolver: required at runtime by
          # scripts/kiosk-config.mjs — photoprism-host crashes on boot without it.
          cp -r config picogallery-release/
          cp install.sh uninstall.sh run.sh config.example.toml README.md picogallery-release/

          # Validate release bundle integrity so appliance installs do not ship
          # without a bootable UI (blank screen risk).
          test -f picogallery-release/frontend/dist/static/build/assets.json
          APP_JS="$(node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync(process.argv[1],'utf8')); process.stdout.write(m['app.js']||'');" picogallery-release/frontend/dist/static/build/assets.json)"
          APP_CSS="$(node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync(process.argv[1],'utf8')); process.stdout.write(m['app.css']||'');" picogallery-release/frontend/dist/static/build/assets.json)"
          test -n "$APP_JS"
          test -n "$APP_CSS"
          test -f "picogallery-release/frontend/dist/static/build/$APP_JS"
          test -f "picogallery-release/frontend/dist/static/build/$APP_CSS"
          test -f picogallery-release/config/kiosk-profiles.json
          test -f picogallery-release/config/kiosk-config-core.mjs

          tar -czf picogallery-release.tar.gz -C picogallery-release .

          # Post-package smoke test: extract the exact archive users download
          # and verify it is complete and its entrypoints parse. Catches broken
          # tar layout, missing files, and syntax errors before publishing.
          mkdir -p /tmp/release-verify
          tar -xzf picogallery-release.tar.gz -C /tmp/release-verify
          bash -n /tmp/release-verify/install.sh
          bash -n /tmp/release-verify/uninstall.sh
          bash -n /tmp/release-verify/run.sh
          bash -n /tmp/release-verify/scripts/pi-canary.sh
          bash -n /tmp/release-verify/scripts/pi-e2e-diagnose.sh
          test -x /tmp/release-verify/scripts/pi-canary.sh
          test -x /tmp/release-verify/scripts/pi-e2e-diagnose.sh
          node --check /tmp/release-verify/scripts/photoprism-host.mjs
          # Execute (not just parse) the kiosk config module from the extracted
          # archive: catches missing config/ data that `node --check` cannot.
          (cd /tmp/release-verify && node --input-type=module -e "const m = await import('./scripts/kiosk-config.mjs'); const c = m.buildKioskConfig(); if (!c.profile || !c.thumbSize) { throw new Error('kiosk config incomplete'); } console.log('kiosk config ok:', c.profile);")
          test -f /tmp/release-verify/frontend/index.html
          test -f "/tmp/release-verify/frontend/dist/static/build/$APP_JS"
          test -f "/tmp/release-verify/frontend/dist/static/build/$APP_CSS"
          test -f /tmp/release-verify/kiosk/cog/picogallery-kiosk.service
          test -f /tmp/release-verify/kiosk/cog/picogallery-kiosk.sh
          test -f /tmp/release-verify/kiosk/cog/picogallery-kiosk.sudoers
          test -f /tmp/release-verify/kiosk/cog/cog.conf
          test -f /tmp/release-verify/config.example.toml

          # Checksums so installs can verify the download.
          sha256sum picogallery-release.tar.gz install.sh uninstall.sh > SHA256SUMS

      - name: Upload Release
        if: steps.version.outputs.skip != 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: |
            picogallery-release.tar.gz
            install.sh
            uninstall.sh
            SHA256SUMS
          generate_release_notes: true
