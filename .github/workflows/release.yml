name: CI & Release

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  ci-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          
      - name: Install root dependencies
        run: npm install
        
      - name: Run CI Checks
        run: |
          npm run lint
          npm test
          
      - name: Determine version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: version
        run: node scripts/get-next-version.js
        
      - name: Create Release Archive
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.version.outputs.skip != 'true'
        run: |
          # Inject release version details into install.sh
          sed -i 's/SCRIPT_VERSION="2.0.0"/SCRIPT_VERSION="'"${{ steps.version.outputs.version }}"'"/g' install.sh

          mkdir -p picogallery-release
          
          # Ship only runtime frontend artifacts required by photoprism-host.
          mkdir -p picogallery-release/frontend
          cp frontend/index.html picogallery-release/frontend/
          cp -r frontend/static picogallery-release/frontend/
          cp -r frontend/dist picogallery-release/frontend/
          cp -r kiosk picogallery-release/
          
          cp package.json picogallery-release/
          cp -r scripts picogallery-release/
          cp install.sh uninstall.sh run.sh config.example.toml README.md picogallery-release/

          # Validate release bundle integrity so appliance installs do not ship
          # without a bootable UI (blank screen risk).
          test -f picogallery-release/frontend/dist/static/build/assets.json
          APP_JS="$(node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync(process.argv[1],'utf8')); process.stdout.write(m['app.js']||'');" picogallery-release/frontend/dist/static/build/assets.json)"
          APP_CSS="$(node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync(process.argv[1],'utf8')); process.stdout.write(m['app.css']||'');" picogallery-release/frontend/dist/static/build/assets.json)"
          test -n "$APP_JS"
          test -n "$APP_CSS"
          test -f "picogallery-release/frontend/dist/static/build/$APP_JS"
          test -f "picogallery-release/frontend/dist/static/build/$APP_CSS"
          
          tar -czf picogallery-release.tar.gz -C picogallery-release .
          
      - name: Upload Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.version.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: |
            picogallery-release.tar.gz
            install.sh
          generate_release_notes: true
