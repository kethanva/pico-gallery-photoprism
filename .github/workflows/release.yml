name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Determine version
        id: version
        run: node scripts/get-next-version.js
          
      - name: Install pnpm
        if: steps.version.outputs.skip != 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 11
          
      - name: Setup Node.js
        if: steps.version.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          
      - name: Install dependencies
        if: steps.version.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile
        
      - name: Build projects
        if: steps.version.outputs.skip != 'true'
        run: |
          pnpm build
          cd frontend && npm ci && npm run build
        
      - name: Create Release Archive
        if: steps.version.outputs.skip != 'true'
        run: |
          # Inject release version details into install.sh
          sed -i 's/SCRIPT_VERSION="2.0.0"/SCRIPT_VERSION="'"${{ steps.version.outputs.version }}"'"/g' install.sh

          mkdir -p picogallery-release/server
          mkdir -p picogallery-release/client
          mkdir -p picogallery-release/shared
          mkdir -p picogallery-release/frontend
          
          # Build production-only, cross-platform dependencies using pnpm deploy
          pnpm deploy --filter @pico/server --prod --legacy picogallery-release/server
          
          # Copy frontend and client dists
          cp -r client/dist picogallery-release/client/
          if [ -d "shared/dist" ]; then cp -r shared/dist picogallery-release/shared/; fi
          cp -r frontend/dist picogallery-release/frontend/
          cp frontend/index.html picogallery-release/frontend/dist/
          cp frontend/config.json picogallery-release/frontend/dist/
          cp -r kiosk picogallery-release/
          
          # Copy essential package configs
          cp package.json picogallery-release/
          cp client/package.json picogallery-release/client/
          if [ -f "shared/package.json" ]; then cp shared/package.json picogallery-release/shared/; fi
          
          # Copy scripts and configs
          cp -r scripts picogallery-release/
          cp install.sh run.sh config.example.toml README.md picogallery-release/
          
          # Tar everything up
          tar -czf picogallery-release.tar.gz -C picogallery-release .
          
      - name: Upload Release
        if: steps.version.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: picogallery-release.tar.gz
          generate_release_notes: true

