name: CI & Release

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  ci-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          
      - name: Install root dependencies
        run: npm install
        
      - name: Run CI Checks & Build
        run: |
          npm run lint
          cd frontend && npm ci
          npm run build
          
      - name: Determine version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: version
        run: node scripts/get-next-version.js
        
      - name: Create Release Archive
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.version.outputs.skip != 'true'
        run: |
          # Inject release version details into install.sh
          sed -i 's/SCRIPT_VERSION="2.0.0"/SCRIPT_VERSION="'"${{ steps.version.outputs.version }}"'"/g' install.sh

          mkdir -p picogallery-release/frontend
          
          # Copy frontend dist
          cp -r frontend/dist picogallery-release/frontend/
          cp frontend/index.html picogallery-release/frontend/dist/
          cp frontend/config.json picogallery-release/frontend/dist/
          cp -r kiosk picogallery-release/
          
          # Copy essential package configs
          cp package.json picogallery-release/
          
          # Copy scripts and configs
          cp -r scripts picogallery-release/
          cp install.sh run.sh config.example.toml README.md picogallery-release/
          
          # Tar everything up
          tar -czf picogallery-release.tar.gz -C picogallery-release .
          
      - name: Upload Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.version.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: picogallery-release.tar.gz
          generate_release_notes: true
