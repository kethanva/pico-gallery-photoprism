# PicoGallery V2 configuration
# Copy to ~/.config/picogallery/config.toml and edit.
# Every key can be overridden with PICO_<SECTION>_<KEY> env vars.

[display]
slide_duration_secs = 10
transition          = "fade"   # cut | fade | slide_left | slide_right
transition_ms       = 800
fill_screen         = false
letterbox_blur      = true
ken_burns           = false
show_osd            = true
show_clock          = false
order               = "shuffle"  # shuffle | chronological | newest_first | date_cluster
on_this_day_boost   = true
max_image_mb        = 50
max_megapixels      = 24

# Where the frame goes when the viewer presses Esc (leave the slideshow → PhotoPrism
# UI). Leave unset on the standard appliance: the frame derives it from its own
# hostname on the PhotoPrism-host port (8190). Set this only if the PhotoPrism UI
# host runs on a different host/port.
# photoprism_url    = "http://192.168.1.50:8190"

# Optional night mode (HH:MM, overnight windows supported)
# [display.night]
# start       = "21:00"
# end         = "07:00"
# dim_percent = 25
# warmth      = 30

# Minimal PhotoPrism UI performance (Pi Zero 2 / kiosk browser).
# Profiles: pi_zero_2 (default, safest) | balanced | quality
# Override any key below; invalid values are clamped to safe ranges.
[kiosk]
profile = "pi_zero_2"
# preview_size = "fit_720"          # fit_720 | fit_1280 (slideshow decode cost)
# thumb_size = "fit_720"            # PhotoPrism minimum; do not lower
# first_page_size = 16
# page_size = 20
# max_grid_rows = 10                # DOM window cap while scrolling
# eager_thumb_count = 16            # high-priority thumbs on first paint
# thumb_load_concurrency = 4        # parallel thumb fetches per batch
# background_fill_target = 32       # 0 = disable slideshow prefetch
# background_fill_delay_ms = 2000
# scroll_idle_ms = 250
# suspend_grid_in_preview = true    # unload grid thumbs during fullscreen
# prefetch_next_slide = true
# auto_slideshow = true
# virtual_fullscreen_only = true

# Optional display schedule (turn HDMI off overnight)
# [display.schedule]
# on  = "07:00"
# off = "22:00"

[cache]
max_mb = 256
# dir  = "/var/cache/picogallery"

[http]
# Same-device kiosk default. For a remote display, use 0.0.0.0 and set a
# random auth_token of at least 24 characters; then open ?token=<value> once.
host = "127.0.0.1"
port = 8190
# auth_token = "replace-with-at-least-24-random-characters"

# ─── Sources ─────────────────────────────────────────────────────────────────
# Photos come from a PhotoPrism backend over the network. There is no local
# directory source — the frame never scans the device's own filesystem.

[[sources]]
name     = "photoprism"
enabled  = true
url      = "http://photoprism.local:2342"
username = "frame-viewer"      # dedicated least-privilege viewer account
app_password = "replace-me"    # never use an administrator password
#
# # Filtering (all optional, combined with AND)
# # album       = "january-2024"
# # favorites   = true
# # quality     = 3               # 1=low … 5=excellent
# # country     = "fr"
# # year        = 2024
# # after       = "2020-01-01"
# # mono        = true
# # panorama    = true
# # orientation = "portrait"
# # people      = ["Alice", "Bob"]
# # labels      = ["beach", "dog"]
# # memories    = true            # only photos taken on today's date in any year
# # query       = "label:beach"   # raw PhotoPrism Q-language
include_private  = false
include_archived = false
order    = "newest"
skip_tls_verify = false

# WebDAV and local-directory sources are not implemented by the shipped host.
