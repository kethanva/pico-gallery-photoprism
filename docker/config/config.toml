# PicoGallery V2 — Docker demo config.
# Mounted read-only at /config/config.toml (see docker-compose.yml).

[display]
slide_duration_secs = 10
transition          = "fade"
order               = "shuffle"
on_this_day_boost   = true

[cache]
dir    = "/cache"
max_mb = 512

[http]
host = "0.0.0.0"
port = 8188

# Demo source: the bundled sample_photos folder, mounted at /photos.
[[sources]]
name      = "directory"
enabled   = true
paths     = ["/photos"]
recursive = true
order     = "alphabetical"

# To drive the frame from PhotoPrism instead, comment out the directory source
# above and configure this one (see docs/sources.md):
# [[sources]]
# name             = "photoprism"
# enabled          = true
# url              = "http://photoprism:2342"
# username         = "admin"
# password         = "please-change"
# include_private  = false
# include_archived = false
