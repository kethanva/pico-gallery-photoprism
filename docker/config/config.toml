# PicoGallery V2 — Docker demo config.
# Mounted read-only at /config/config.toml (see docker-compose.yml).

[display]
slide_duration_secs = 10
transition          = "fade"
order               = "shuffle"
on_this_day_boost   = true

[cache]
dir    = "/cache"
max_mb = 512

[http]
host = "0.0.0.0"
port = 8188

# Photos come from a PhotoPrism backend. Point `url` at your PhotoPrism host
# (the commented `photoprism` service in docker-compose.yml spins one up locally).
[[sources]]
name             = "photoprism"
enabled          = true
url              = "http://photoprism:2342"
username         = "admin"
password         = "please-change"
include_private  = false
include_archived = false
order            = "newest"
