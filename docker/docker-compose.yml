# PicoGallery V2 — local stack.
#
#   docker compose -f docker/docker-compose.yml up --build
#
# Serves the frame at http://localhost:8188 from ./sample_photos by default.
# Uncomment the `photoprism` service and the matching source in your config.toml
# to drive the frame from a PhotoPrism library instead.

services:
  picogallery:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8188:8188"
    volumes:
      - ./config:/config:ro          # put config.toml here
      - ../sample_photos:/photos:ro  # demo directory source
      - pico-cache:/cache
    restart: unless-stopped

  # photoprism:
  #   image: photoprism/photoprism:latest
  #   ports: ["2342:2342"]
  #   environment:
  #     PHOTOPRISM_ADMIN_PASSWORD: "please-change"
  #     PHOTOPRISM_HTTP_PORT: 2342
  #   volumes:
  #     - ./photoprism/originals:/photoprism/originals
  #     - ./photoprism/storage:/photoprism/storage
  #   restart: unless-stopped

volumes:
  pico-cache:
