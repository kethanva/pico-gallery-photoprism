# PicoGallery V2 — local stack.
#
#   docker compose -f docker/docker-compose.yml up --build
#
# The frame at http://localhost:8188 pulls photos from the `photoprism` service
# below. Point config/config.toml's `[[sources]]` url at your own PhotoPrism host
# instead if you already run one on the network.

services:
  picogallery:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8188:8188"
    volumes:
      - ./config:/config:ro          # put config.toml here
      - pico-cache:/cache
    depends_on:
      - photoprism
    restart: unless-stopped

  photoprism:
    image: photoprism/photoprism:latest
    ports: ["2342:2342"]
    environment:
      PHOTOPRISM_ADMIN_PASSWORD: "please-change"
      PHOTOPRISM_HTTP_PORT: 2342
    volumes:
      - ./photoprism/originals:/photoprism/originals
      - ./photoprism/storage:/photoprism/storage
    restart: unless-stopped

volumes:
  pico-cache:
