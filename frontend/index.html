<!DOCTYPE html>
<html lang="en" dir="auto" data-color-mode="dark" data-light-theme="light" data-dark-theme="dark" class="loading">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>PhotoPrism</title>

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="PhotoPrism">

  <link rel="icon" href="static/img/favicon.ico">
  
  <script>
    (function() {
      // PicoGallery appliance: purge stale service workers and caches left by
      // earlier frame/SPA builds before loading hashed webpack assets.
      if ("serviceWorker" in navigator && navigator.serviceWorker.getRegistrations) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          regs.forEach(function(r) { r.unregister(); });
        });
      }
      if (typeof caches !== "undefined" && caches.keys) {
        caches.keys().then(function(keys) {
          keys.forEach(function(k) { caches.delete(k); });
        });
      }
      // Synchronously load config.json
      var configReq = new XMLHttpRequest();
      configReq.open('GET', 'config.json', false);
      try {
        configReq.send(null);
      } catch (e) {
        console.warn("Failed to load config.json, using defaults:", e);
      }

      var windowTitle = "Photo Frame";
      var appConfig = {};
      if (configReq.status === 200) {
        appConfig = JSON.parse(configReq.responseText);
        windowTitle = appConfig.windowTitle || windowTitle;
      }

      document.title = windowTitle;

      // The SPA is always served by the PhotoPrism host (scripts/photoprism-host.mjs),
      // which reverse-proxies /api/v1 to the real PhotoPrism backend, so the API base
      // MUST be same-origin and relative. The old code derived it from config.json's
      // `serverUrl`; the committed value points at the deleted :8188 @pico server, and
      // an absolute base makes every API / websocket / thumbnail call bypass the proxy
      // and hit that dead host directly. The host masks this today by forcing
      // serverUrl:"" in the config.json it serves, but the SPA should not depend on
      // that rewrite. Hardcode relative here; `serverUrl` now configures ONLY the
      // host's proxy-target fallback.
      window.__CONFIG__ = {
        baseUri: "",
        staticUri: "static",
        apiUri: "/api/v1",
        contentUri: "/api/v1",
        videoUri: "/api/v1",
        previewToken: "public",
        downloadToken: "public",
        theme: "default",
        appName: "PhotoPrism",
        settings: {
          ui: {
            theme: "default",
            zoom: true
          }
        },
        kioskConfig: appConfig.kioskConfig,
        disableServiceWorker: true
      };

      // Synchronously load assets.json to get hashed filenames
      var manifestReq = new XMLHttpRequest();
      manifestReq.open('GET', 'static/build/assets.json', false);
      try {
        manifestReq.send(null);
      } catch (e) {
        console.error("Failed to load assets.json:", e);
      }

      if (manifestReq.status === 200) {
        var manifest = JSON.parse(manifestReq.responseText);
        
        // Append stylesheet
        var link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = 'static/build/' + manifest['app.css'];
        document.head.appendChild(link);
        
        // Append JS entry point - defer attribute handles async loading order
        var script = document.createElement('script');
        script.src = 'static/build/' + manifest['app.js'];
        script.defer = true;
        document.head.appendChild(script);
      } else {
        console.error("Cannot initialize app - assets.json not found.");
      }
    })();
  </script>
</head>
<body class="nojs">
  <div id="app">
    <div id="photoprism" class="splash-screen container">
      <div id="splash-info" class="has-js splash-info">
        <div class="about">PhotoPrism</div>
      </div>
      <div class="splash-center">
        <div class="splash-logo">
          <!-- Standalone simple SVG logo -->
          <svg viewBox="0 0 100 100" width="128" height="128">
            <circle cx="50" cy="50" r="40" fill="#3182ce"/>
            <polygon points="50,25 30,65 70,65" fill="#ffffff"/>
          </svg>
        </div>
        <progress id="progress" class="html-progress" role="progressbar" max="100"></progress>
      </div>
    </div>
  </div>
  <div id="busy-overlay">
    <div class="splash-center">
      <progress id="busy-progress" class="html-progress" role="progressbar" max="100"></progress>
    </div>
  </div>
</body>
</html>
